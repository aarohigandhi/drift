name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Java tests
        working-directory: java
        run: ./gradlew test

      - name: Dump oracle tables
        working-directory: java
        run: ./gradlew dumpTables --args="../results/oracle"

      - name: Check every code and pair against exact rational arithmetic
        working-directory: python
        run: python verify_oracle.py --tables ../results/oracle
